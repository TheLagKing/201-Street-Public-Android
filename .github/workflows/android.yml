name: Android Build Test

on:
  workflow_dispatch:

jobs:
  Android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install System Dependencies # <-- REQUIRED FIX
        run: |
          sudo apt update
          sudo apt install -y libasound2-dev libpulse-dev libx11-dev libxi-dev libgl1-mesa-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libudev-dev libssl-dev \
            libusb-1.0-0-dev ninja-build

      - name: Setup Java JDK
        uses: actions/setup-java@main
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet
          haxelib install format --quiet
          haxelib install hxp --quiet

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Something
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g" >> ~/.gradle/gradle.properties

      - name: Build APK
        run: haxelib run lime build android

      - name: Locate APK (debug helper)
        run: |
          echo "Searching for APK files..."
          find export -type f -name "*.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: androidBuild
          path: export/debug/android/bin/*.apk
          if-no-files-found: error
